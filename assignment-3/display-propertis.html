<!DOCTYPE html>
<html>

<head>
    <title>Display properties and Color</title>
</head>

<style>
    .btm {
        background-color: #00ffff;
        height: 100px;
        width: 50px;
    }

    .sdt {
        background-color: #ff6347;
        margin: 10px;
        padding: 10px;
    }

    .cat {
        background-color: hsl(180, 100%, 50%);
        margin: 0px;
        height: 100px;
        width: 500px;
        padding: 10px;
    }

    .dog {
        background-color: rgb(138, 43, 226);
        margin: 10px;
        height: 200px;
        width: 500px;
        padding: 10px;
    }

    .img {
        background-color: rgb(127, 255, 212);
        height: 200px;
        width: 250px;
        margin: 10px;
        border-radius: 10px;
        display: inline-block;
        text-align: center;
        padding-top: 70px;
    }


    .a {
        height: 100px;
        width: 100px;
        border-radius: 50px;


    }
</style>

</head>

<body>
    <h2>Inline Elememnt</h2>

    <span class="btm">Shruti</span>
    <span class="btm">Karina</span>
    <span class="btm">I am a student</span>
    <i class="btm">I am a good</i>

    <h2>Block Element</h2>

    <div class="sdt">I am a BCA Student</div>

    <div class="cat">My name is Shruti Tarare. I am from Mandhal, Maharashtra.</div>

    <div class="dog">I have a brother</div>

    <h2>Inline-block Element</h2>
    <div class="img">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSdDLUy50DVrPM3YtupY5OtnnxkqJiO8KMB-OZ4L_Q4p-tr3E3PVsp3aEyX&s=10"
            class="a" />
        <h3>Virat Kohli</h3>
    </div>
    <div class="img">
        <img src="https://static.toiimg.com/thumb/msid-63894357,width-400,resizemode-4/63894357.jpg" class="a" />
        <h3>Sachin Tendulkar</h3>
    </div>
    <div class="img">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQTrkOkIEodOcdQ3RUKL5xc_jfbkGlom076sgpu1mjlE3Il5U65VbL7Fb-f&s=10"
            class="a" />
        <h3>Rohit Sharma</h3>
    </div>


</body>

</html>
